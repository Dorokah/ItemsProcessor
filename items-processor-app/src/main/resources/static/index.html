<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HBase Pokemon Explorer</title>
  <style>body{font:15px system-ui;background:#0f172a;color:#e2e8f0;margin:0;padding:32px}input{padding:10px;width:320px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:24px}.card{background:#1e293b;padding:18px;border-radius:12px}code{color:#93c5fd}.muted{color:#94a3b8}</style>
</head>
<body><h1>HBase Pokemon Explorer</h1><input id="search" placeholder="Search Pokemon" oninput="render()"><div id="grid" class="grid"></div>
<script>
let rows=[];fetch('/api/hbase/pokemon').then(r=>r.json()).then(data=>{rows=data;render()});
function render(){const q=search.value.toLowerCase();grid.innerHTML=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).map(r=>`<article class="card"><code>#${r.rowKey}</code><h2>${r.columns['name:english']||'Pokemon'}</h2><p>${r.columns['name:surname']||''} ${r.columns['name:frenchSurname']||''}</p><p class="muted">${r.columns['info:description']||''}</p></article>`).join('')}
</script></body></html>
