apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo-ds
    isDefault: true
    jsonData:
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: 'elasticsearch-ds'
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        tags: [{ key: 'service.name', value: 'serviceName' }]
        filterByTraceID: true
        filterBySpanID: false

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    uid: elasticsearch-ds
    isDefault: false
    jsonData:
      timeField: "@timestamp"
      index: "rabbitprocessor-*"
      database: "[rabbitprocessor-]*"
      version: "7.0.0+"
      logMessageField: "message"
      logLevelField: "level"
      derivedFields:
        - datasourceUid: "tempo-ds"
          matcherType: "label"
          matcherRegex: "traceId"
          name: "traceId"
          url: "${__value.raw}"
          urlDisplayLabel: "View Trace"
