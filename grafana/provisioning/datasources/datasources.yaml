apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo-ds
    isDefault: true
    jsonData:
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: 'elasticsearch-ds'
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        tags: [{ key: 'service.name', value: 'serviceName' }]
        filterByTraceID: true
        filterBySpanID: false

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    uid: elasticsearch-ds
    isDefault: false
    jsonData:
      timeField: "@timestamp"
      index: "rabbitprocessor-*"
      database: "[rabbitprocessor-]*"
      version: "7.0.0+"
      logMessageField: "message"
      logLevelField: "level"
      dataLinks:
        - datasourceUid: "tempo-ds"
          field: "traceId"
          url: "/explore?left=%7B%22datasource%22%3A%22elasticsearch-ds%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22query%22%3A%22traceId%3A%5C%22%24%7B__value.raw%7D%5C%22%22%2C%22metrics%22%3A%5B%7B%22id%22%3A%221%22%2C%22type%22%3A%22logs%22%7D%5D%2C%22bucketAggs%22%3A%5B%5D%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-6h%22%2C%22to%22%3A%22now%22%7D%7D&right=%7B%22datasource%22%3A%22tempo-ds%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22queryType%22%3A%22traceId%22%2C%22query%22%3A%22%24%7B__value.raw%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-6h%22%2C%22to%22%3A%22now%22%7D%7D"
