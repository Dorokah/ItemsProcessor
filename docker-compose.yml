services:
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"   # HTTP API
      - "6831:6831/udp" # Jaeger thrift compact UDP

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/provisioning/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      - tempo

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.3
    container_name: logstash
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_MESSAGE_MAX_BYTES=10000000

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/bash", "-c"]
    command: >
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
        echo "Waiting for Kafka to accept connections...";
        sleep 2;
      done;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pokedex-raw --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pokemon-individual --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic hbase-status --partitions 1 --replication-factor 1;
      echo "Kafka topics ready"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

  hbase:
    image: harisekhon/hbase:1.4
    container_name: hbase
    ports:
      - "9090:9090" # Thrift API
      - "16010:16010" # Master Web UI

  webhook-mock:
    image: kennethreitz/httpbin
    container_name: webhook-mock
    ports:
      - "8080:80"

  splitter-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitter-service
    depends_on:
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      logstash:
        condition: service_started
    environment:
      - REQUEST_HANDLER=src.RequestsHandlers.pipeline.SplitRequestsHandler
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUME_TOPIC=pokedex-raw
      - PUBLISH_TOPIC=pokemon-individual
      - SERVICE_NAME=splitter
      - LOGSTASH_ENABLE=True
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - TRACING_ENABLE=True
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_AGENT_PORT=6831

  hbase-writer-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hbase-writer-service
    depends_on:
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      hbase:
        condition: service_started
      logstash:
        condition: service_started
    environment:
      - REQUEST_HANDLER=src.RequestsHandlers.pipeline.HBaseRequestsHandler
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUME_TOPIC=pokemon-individual
      - PUBLISH_TOPIC=hbase-status
      - HBASE_HOST=hbase
      - HBASE_PORT=9090
      - HBASE_TABLE_NAME=pokemon
      - SERVICE_NAME=hbase-writer
      - LOGSTASH_ENABLE=True
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - TRACING_ENABLE=True
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_AGENT_PORT=6831

  webhook-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webhook-service
    depends_on:
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      webhook-mock:
        condition: service_started
      logstash:
        condition: service_started
    environment:
      - REQUEST_HANDLER=src.RequestsHandlers.httpout.WebhookRequestsHandler
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUME_TOPIC=hbase-status
      - WEBHOOK_URL=http://webhook-mock/post
      - SERVICE_NAME=webhook
      - LOGSTASH_ENABLE=True
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - TRACING_ENABLE=True
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_AGENT_PORT=6831

  hbase-browser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hbase-browser
    depends_on:
      hbase:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      - HBASE_HOST=hbase
      - HBASE_PORT=9090
      - HBASE_TABLE_NAME=pokemon
    entrypoint: ["python3", "src/hbase_browser.py"]

volumes:
  elasticsearch-data:
