services:
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"   # HTTP API
      - "6831:6831/udp" # Jaeger thrift compact UDP

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/provisioning/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      - tempo

  pokemon-trace-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokemon-trace-dashboard
    depends_on:
      - tempo
      - grafana
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - TEMPO_URL=http://tempo:3200
      - GRAFANA_URL=http://localhost:3000
      - TRACE_DASHBOARD_LOOKBACK_SECONDS=21600
    entrypoint: ["python3", "-m", "src.pokemon_trace_dashboard"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.3
    container_name: logstash
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_MESSAGE_MAX_BYTES=10000000

  hbase:
    image: harisekhon/hbase:1.4
    container_name: hbase
    ports:
      - "9090:9090" # Thrift API
      - "16010:16010" # Master Web UI

  webhook-mock:
    image: kennethreitz/httpbin
    container_name: webhook-mock
    ports:
      - "8080:80"

  splitter-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: splitter-service
    depends_on:
      kafka:
        condition: service_started
      logstash:
        condition: service_started
    environment:
      - REQUEST_HANDLER=src.RequestsHandlers.pipeline.SplitRequestsHandler
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUME_TOPIC=pokedex-raw
      - PUBLISH_TOPIC=pokemon-individual
      - SERVICE_NAME=splitter
      - BATCH_SIZE=3
      - BATCH_TIMEOUT_SECONDS=1.0
      - LOGSTASH_ENABLE=True
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - TRACING_ENABLE=True
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_AGENT_PORT=6831

  pokemon-surname-generator-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokemon-surname-generator-service
    depends_on:
      kafka:
        condition: service_started
      logstash:
        condition: service_started
      tempo:
        condition: service_started
    volumes:
      - ./pokedex.json:/app/pokedex.json:ro
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PUBLISH_TOPIC=pokemon-surnames
      - POKEDEX_FILE_PATH=/app/pokedex.json
      - SURNAME_GENERATION_INTERVAL_SECONDS=60
      - SERVICE_NAME=pokemon-surname-generator
      - LOGSTASH_ENABLE=True
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - TRACING_ENABLE=True
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_AGENT_PORT=6831
    entrypoint: ["python3", "-m", "src.pokemon_surname_generator"]

  surname-api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surname-api-service
    depends_on:
      logstash:
        condition: service_started
      tempo:
        condition: service_started
    ports:
      - "8066:8066"
    environment:
      - PORT=8066
      - SERVICE_NAME=surname-api
      - LOGSTASH_ENABLE=True
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - TRACING_ENABLE=True
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_AGENT_PORT=6831
    entrypoint: ["python3", "-m", "src.surname_api"]

  surname-enrichment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surname-enrichment-service
    depends_on:
      kafka:
        condition: service_started
      surname-api-service:
        condition: service_started
      logstash:
        condition: service_started
    environment:
      - REQUEST_HANDLER=src.RequestsHandlers.pipeline.SurnameEnrichmentRequestsHandler
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUME_TOPIC=pokemon-surnames
      - PUBLISH_TOPIC=pokemon-ecriched
      - SURNAME_API_URL=http://surname-api-service:8066
      - SERVICE_NAME=surname-enrichment
      - BATCH_SIZE=3
      - BATCH_TIMEOUT_SECONDS=1.0
      - LOGSTASH_ENABLE=True
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - TRACING_ENABLE=True
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_AGENT_PORT=6831

  hbase-writer-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hbase-writer-service
    depends_on:
      kafka:
        condition: service_started
      hbase:
        condition: service_started
      logstash:
        condition: service_started
    environment:
      - REQUEST_HANDLER=src.RequestsHandlers.pipeline.HBaseRequestsHandler
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUME_TOPIC=pokemon-individual
      - PUBLISH_TOPIC=hbase-status
      - HBASE_HOST=hbase
      - HBASE_PORT=9090
      - HBASE_TABLE_NAME=pokemon
      - SERVICE_NAME=hbase-writer
      - BATCH_SIZE=2
      - BATCH_TIMEOUT_SECONDS=1.0
      - MAX_WORKER_THREADS=4
      - LOGSTASH_ENABLE=True
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - TRACING_ENABLE=True
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_AGENT_PORT=6831

  hbase-surname-updater-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hbase-surname-updater-service
    depends_on:
      kafka:
        condition: service_started
      hbase:
        condition: service_started
      logstash:
        condition: service_started
    environment:
      - REQUEST_HANDLER=src.RequestsHandlers.pipeline.HBaseSurnameUpdateRequestsHandler
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUME_TOPIC=pokemon-ecriched
      - HBASE_HOST=hbase
      - HBASE_PORT=9090
      - HBASE_TABLE_NAME=pokemon
      - HBASE_TIMEOUT_MS=5000
      - SERVICE_NAME=hbase-surname-updater
      - BATCH_SIZE=2
      - BATCH_TIMEOUT_SECONDS=1.0
      - MAX_WORKER_THREADS=2
      - LOGSTASH_ENABLE=True
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - TRACING_ENABLE=True
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_AGENT_PORT=6831

  webhook-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webhook-service
    depends_on:
      kafka:
        condition: service_started
      webhook-mock:
        condition: service_started
      logstash:
        condition: service_started
    environment:
      - REQUEST_HANDLER=src.RequestsHandlers.httpout.WebhookRequestsHandler
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONSUME_TOPIC=hbase-status
      - WEBHOOK_URL=http://webhook-mock/post
      - SERVICE_NAME=webhook
      - BATCH_SIZE=3
      - BATCH_TIMEOUT_SECONDS=1.0
      - LOGSTASH_ENABLE=True
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - TRACING_ENABLE=True
      - JAEGER_AGENT_HOST=tempo
      - JAEGER_AGENT_PORT=6831

  hbase-browser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hbase-browser
    depends_on:
      hbase:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      - HBASE_HOST=hbase
      - HBASE_PORT=9090
      - HBASE_TABLE_NAME=pokemon
    entrypoint: ["python3", "src/hbase_browser.py"]

volumes:
  elasticsearch-data:
