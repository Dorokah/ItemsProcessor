services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" # Web UI
      - "6831:6831/udp" # Jaeger Agent (compact thrift protocol)
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.3
    container_name: logstash
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rabbit-processor
    depends_on:
      rabbitmq:
        condition: service_healthy
      logstash:
        condition: service_started
    environment:
      - REQUEST_HANDLER=src.RequestsHandlers.pipeline.GenericRequestsHandler
      - RABBIT_HOST=rabbitmq
      - RABBIT_PORT=5672
      - RABBIT_USERNAME=guest
      - RABBIT_PASSWORD=guest
      - CONSUME_QUEUE=my_incoming_queue
      - PUBLISH_QUEUE=my_outgoing_queue
      - LOGSTASH_ENABLE=True
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - TRACING_ENABLE=True
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831

volumes:
  elasticsearch-data:
